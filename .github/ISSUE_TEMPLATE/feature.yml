name: Feature request
description: Something trex-web-gui does not do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some features are declined by design (more than one user, a `--listen` option, ASTF control):
        CONTRIBUTING.md lists them.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you picture it working, using the UI's own labels where you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
