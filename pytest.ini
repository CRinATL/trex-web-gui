[pytest]
testpaths = tests
pythonpath = backend tests
markers =
    real: needs the TRex KVM guest (make check-real)
    restarts_trex: restarts the guest's TRex (make check-daemon-real)
    vendor_build: rebuilds the vendor tree (set automatically, tests/conftest.py)
    golden: loads every TREX_SRC stl profile through the worker (make check-golden)
addopts = -m "not real and not golden" -p no:cacheprovider
# a hung test fails instead of blocking the run; slowest file (test_api.py) takes ~9 s
timeout = 60
filterwarnings =
    ignore:setDaemon\(\) is deprecated:DeprecationWarning:trex\.common\.trex_subscriber
    ignore:Using `httpx` with `starlette.testclient` is deprecated
