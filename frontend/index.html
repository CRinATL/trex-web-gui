<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- before any stylesheet: sets data-theme and data-density from storage so the first paint is already the chosen theme and density -->
    <script>try{var t=localStorage.getItem('trex-web-gui.theme');if(t==='light'||t==='dark'||t==='contrast')document.documentElement.dataset.theme=t;if(localStorage.getItem('trex-web-gui.density')==='compact')document.documentElement.dataset.density='compact'}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trex-web-gui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
